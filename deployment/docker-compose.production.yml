services:
  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile.production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.production}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: src/backend/api/Dockerfile
    restart: unless-stopped
    env_file: ${FLOORSYNC_ENV_FILE:-../.env.production}
    environment:
      PYTHONPATH: /app/src/backend/common:/app/src/backend/api:/app/src/backend/workers
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: src/backend/workers/Dockerfile
    restart: unless-stopped
    env_file: ${FLOORSYNC_ENV_FILE:-../.env.production}
    environment:
      PYTHONPATH: /app/src/backend/common:/app/src/backend/api:/app/src/backend/workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${FLOORSYNC_ENV_FILE:-../.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
