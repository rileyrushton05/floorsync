
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # tests/integration needs a real PostgreSQL and skips without one. A push to main always runs
      # them. On a pull request the container is only worth it when the change touches code those
      # tests guard (the database, imports, live updates or the simulation), so frontend or
      # unrelated backend changes pay nothing.
      # Started here, detached, so its boot overlaps the install and type-check below; the
      # existing pytest step then runs the integration tests too.
      - name: Start PostgreSQL on main, or when database or live-update code changed
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          paths='^(src/database/migrations/|src/backend/common/floorsync_common/(database|imports|live_updates|simulation)/|src/backend/api/floorsync_api/features/(imports|live_updates|simulation)/|tests/integration/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'
          if [ "$GITHUB_EVENT_NAME" = "push" ] \
            || gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only | grep -qE "$paths"; then
            docker run --detach --name floorsync-test-postgres \
              --env POSTGRES_USER=floorsync --env POSTGRES_PASSWORD=floorsync \
              --env POSTGRES_DB=floorsync_test --publish 5432:5432 postgres:16-alpine
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No database or live-update changes; PostgreSQL integration tests will skip."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group dev --extra resched --extra exact

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Type-check backend
        run: uv run mypy src/backend

      # Over TCP on purpose: the image's first-boot init server only listens on a socket, so a
      # socket check could pass just before the real server restarts.
      - name: Wait for PostgreSQL
        if: steps.integration.outputs.run == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if docker exec floorsync-test-postgres pg_isready -h 127.0.0.1 -U floorsync -d floorsync_test; then
              echo "FLOORSYNC_TEST_DATABASE_URL=postgresql+asyncpg://floorsync:floorsync@localhost:5432/floorsync_test" >> "$GITHUB_ENV"
              echo "FLOORSYNC_REQUIRE_TEST_DATABASE=1" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready." >&2
          exit 1

      - name: Run backend tests
        run: uv run pytest

      - name: Verify generated OpenAPI contract
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Remove generated frontend output
        run: rm -rf src/frontend/.next

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: src/frontend
        run: corepack pnpm lint

      - name: Type-check frontend
        working-directory: src/frontend
        run: corepack pnpm typecheck

      - name: Build frontend
        working-directory: src/frontend
        run: corepack pnpm build
