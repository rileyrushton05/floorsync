name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group dev --extra resched

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Type-check backend
        run: uv run mypy src/backend

      - name: Run backend tests
        run: uv run pytest

      - name: Verify generated OpenAPI contract
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Remove generated frontend output
        run: rm -rf src/frontend/.next

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: src/frontend
        run: corepack pnpm lint

      - name: Type-check frontend
        working-directory: src/frontend
        run: corepack pnpm typecheck

      - name: Build frontend
        working-directory: src/frontend
        run: corepack pnpm build
