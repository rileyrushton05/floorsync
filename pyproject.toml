[project]
name = "floorsync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.4,<2",
  "asyncpg>=0.31.0,<1",
  "celery[redis]>=5.6.3,<6",
  "fastapi>=0.141.1,<1",
  "psycopg[binary]>=3.2.10,<4",
  "pydantic-settings>=2.15.0,<3",
  "sqlalchemy[asyncio]>=2.0.48,<3",
  "uvicorn[standard]>=0.52.3,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.20.2,<2",
  "pytest>=8.4.2,<9",
  "ruff>=0.16.3,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src/backend/common", "src/backend/api", "src/backend/workers"]
exclude = ["src/database/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src/backend/common", "src/backend/api", "src/backend/workers"]
testpaths = ["tests/backend", "tests/integration"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = ["src/backend/common", "src/backend/api", "src/backend/workers"]
exclude = ["src/database/migrations"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
