[project]
name = "floorsync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.5,<6",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.8,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src/backend/common", "src/backend/api", "src/backend/workers"]
exclude = ["src/database/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src/backend/common", "src/backend/api", "src/backend/workers"]
testpaths = ["tests/backend", "tests/integration"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = ["src/backend/common", "src/backend/api", "src/backend/workers"]
exclude = ["src/database/migrations"]

[[tool.mypy.overrides]]
module = ["celery"]
ignore_missing_imports = true
